[project]
name = "qec-research"
version = "0.1.0"
description = "Automated co-design of qLDPC codes, FT syndrome-extraction circuits, and low-latency decoders under circuit-level noise"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "galois>=0.3.8",
    "networkx>=3.2",
    "stim>=1.13",
    "pymatching>=2.2",
    "sinter>=1.13",
    "ldpc>=2.1",
    "matplotlib>=3.8",
    "sympy>=1.12",
    "pandas>=2.1",
    "ortools>=9.8",
    "python-sat>=1.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-xdist>=3.5", "hypothesis>=6.90"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qec_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
